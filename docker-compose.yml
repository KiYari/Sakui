# One-command deploy:  docker compose up -d --build
#
# Topology: the browser only ever talks to `web` (nginx). nginx serves the built
# SPA and forwards /api and /ws to `server` over the private compose network.
# `server` is deliberately NOT published to the host — nothing outside the
# network should reach the Ktor process directly.

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      EECK_PORT: "3001"
      # Same-origin through nginx means CORS is never exercised in this topology.
      # Kept explicit so a split-origin deployment has an obvious knob to turn.
      EECK_CORS_HOST: "${EECK_CORS_HOST:-localhost}"
      # Take the client address from nginx's X-Forwarded-For, which nginx sets
      # itself. Safe only because this container is reachable solely via nginx.
      EECK_TRUST_PROXY: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      # JVM cold start; don't mark unhealthy while it's still booting.
      start_period: 40s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${EECK_HTTP_PORT:-80}:80"
    depends_on:
      # Wait for /api/health, not just for the container to exist, so the first
      # page load can't hit a proxy whose upstream isn't listening yet.
      server:
        condition: service_healthy
    restart: unless-stopped
