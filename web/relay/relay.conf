# Server-level half of the relay, included into nginx.conf's server block only
# in a relay-mode image (EECK_SERVER_MODE=relay, see web/Dockerfile).
#
# Forwards /s/<ipv4>:<port>/api/... and /s/<ipv4>:<port>/ws to that eeck
# server, so a page served from here can use chat servers that speak only
# plain HTTP. The target rides in the path because a browser cannot add a
# header to a WebSocket handshake.
#
# Anyone can point this at an address, so it is kept narrow:
#   - IPv4 literals only. A host name would be resolved here, by Docker's DNS,
#     where `server` and every other internal name lives.
#   - Public addresses only ($eeck_relay_blocked, relay-maps.conf).
#   - Only /api/... and /ws — what an eeck server answers, nothing else.
#
# Relayed traffic stays end-to-end encrypted: like the server itself, this
# hop only ever sees ciphertext frames.
location ~ "^/s/(?<relay_ip>(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}):(?<relay_port>[1-9][0-9]{0,4})(?<relay_path>/api/.*|/ws)$" {
    if ($eeck_relay_blocked) {
        return 403;
    }

    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://$relay_ip:$relay_port$relay_path$is_args$args;

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $eeck_connection_upgrade;
    proxy_set_header Host              $relay_ip:$relay_port;
    # The page's Origin is this relay's, which the target would rightly treat
    # as foreign and refuse (CORS). From the target's side the relay is the
    # client, making a same-origin request; an empty value drops the header.
    proxy_set_header Origin            "";
    # The target only honours this if it trusts the relay as a proxy; it
    # otherwise rate-limits every relayed user as this one address.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $client_proto;

    # Fail fast on a dead address instead of hanging the picker's health check.
    proxy_connect_timeout 5s;
    # Same as /ws in nginx.conf: rooms idle between messages.
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_buffering       off;
}
