# http-level half of the relay; see relay.conf. Installed only in a relay-mode
# image (web/Dockerfile), because these maps name relay.conf's captures and
# nginx refuses to start on a variable nothing defines.

# Every address the relay must never reach: loopback, private, link-local
# (incl. the cloud metadata endpoint 169.254.169.254), CGNAT, multicast and
# reserved. Kept in step with isNonPublicIpv4 in
# web/src/shared/lib/server-target, which only gives a friendlier error first.
map $relay_ip $eeck_relay_blocked {
    default                                 0;
    ~^(0|10|127)\.                          1;
    ~^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\. 1;
    ~^169\.254\.                            1;
    ~^172\.(1[6-9]|2[0-9]|3[01])\.          1;
    ~^192\.168\.                            1;
    ~^(22[4-9]|2[3-5][0-9])\.               1;
}

# The relay carries both REST calls and WebSocket upgrades through one location.
map $http_upgrade $eeck_connection_upgrade {
    default upgrade;
    ''      close;
}
