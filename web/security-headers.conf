# Included into every location that sets its own headers. nginx drops all
# server-level add_header directives in any location that declares one of its
# own, so declaring these once at server level would silently skip /assets/
# and /index.html.

# Scripts and styles only from this origin (the Vite build emits no inline code).
# Images may be blob: because received attachments render from object URLs.
# connect-src 'self' covers the same-origin wss:// relay.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

# Without this a browser may sniff a blob or asset into a more dangerous type
# than the one it was served with — the exact thing safeMimeType guards against.
add_header X-Content-Type-Options "nosniff" always;

# The chat id lives in the URL query; with a referrer it would leak to any
# third-party request a page could ever make.
add_header Referrer-Policy "no-referrer" always;

add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
