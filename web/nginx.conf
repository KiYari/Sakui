# Serves the built SPA and proxies the API and WebSocket to the Ktor container.
#
# Everything is on ONE origin on purpose. The client derives its socket URL from
# window.location.origin (see E2eeClient) and calls the REST API with relative
# paths, so same-origin means no CORS preflight and no per-deployment origin
# configuration to keep in sync.

# If a TLS terminator (see docker-compose.tls.yml) sits in front, the browser's
# real scheme is https while this hop is plain http. Forward what the client
# actually used, not what nginx sees, or the app sees "http" behind HTTPS.
map $http_x_forwarded_proto $client_proto {
    default $scheme;
    ~.      $http_x_forwarded_proto;
}

# Chat ids are bearer secrets — holding one is enough to ask to join — and the
# default "combined" log line carries them three ways: in API paths, in the
# SPA's `?chatId=` query string, and in the Referer. This format logs the path
# without its query string, with the id segments of the chat-link API replaced.
# (nginx's error_log can still quote a request line when an upstream fails;
# keep its level at the default `error` and treat that file accordingly.)
map $uri $eeck_log_path {
    "~^/api/chat-link/status/[^/]+$"  "/api/chat-link/status/<redacted>";
    "~^/api/chat-link/[^/]+$"         "/api/chat-link/<redacted>";
    default                         $uri;
}

log_format eeck_redacted '$remote_addr [$time_local] "$request_method $eeck_log_path" '
                         '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log eeck_redacted;

    # The server rate-limits per client address, so it has to see the real one.
    # Behind the TLS overlay the direct peer is Caddy on the compose network,
    # which sets X-Forwarded-For itself from the actual client; only private
    # (container network) peers are trusted to supply it. A client connecting
    # straight to a published port arrives from its own public address, so a
    # header it forges is ignored. (If a host's Docker setup NATs public traffic
    # to a private source address — e.g. the userland proxy — this trust is too
    # broad: publish nginx only through the TLS overlay there.)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Without this nginx resolves the `server` name once
    # at startup and caches it forever, so redeploying only the backend (which
    # gives it a new container IP) would serve 502s until nginx itself restarted.
    # Re-resolving needs the upstream in a variable — and a variable proxy_pass
    # drops the request URI, so it has to be reattached with $request_uri.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Vite emits content-hashed filenames under /assets, so they can be cached
    # forever. index.html must NOT be, or a browser keeps booting an old bundle
    # against a newer server after a redeploy.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        set $eeck_upstream http://server:3001;
        proxy_pass $eeck_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwritten, not appended: the server trusts this header (EECK_TRUST_PROXY),
        # so whatever chain a client sent must not reach it.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    location /ws {
        set $eeck_upstream http://server:3001;
        proxy_pass $eeck_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwritten, not appended: the server trusts this header (EECK_TRUST_PROXY),
        # so whatever chain a client sent must not reach it.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_proto;

        # A chat room is idle between messages. The app pings every 15s, but
        # nginx's 60s default would still drop a quiet room, so raise both sides.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Relayed frames are small and latency matters more than batching.
        proxy_buffering off;
    }

    # The app keeps chat state in a ?chatId= query param rather than a path, but
    # any unknown path must still boot the SPA rather than 404.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
